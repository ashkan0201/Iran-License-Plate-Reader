<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRAN License Plate Reader</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #f8f5ff;
      --bg-secondary: #ffffff;
      --bg-glass: rgba(255, 255, 255, 0.65);
      --text-primary: #1a0a2e;
      --text-secondary: #5a3d8a;
      --accent: #8b5cf6;
      --accent-glow: #a78bfa;
      --neon-1: #c084fc;
      --neon-2: #e879f9;
      --neon-3: #d946ef;
      --border: rgba(139, 92, 246, 0.25);
      --shadow: 0 8px 32px rgba(139, 92, 246, 0.15);
      --upload-bg: rgba(255, 255, 255, 0.8);
      --upload-border: #c4b5fd;
      --upload-hover: #a78bfa;
    }

    [data-theme="dark"] {
      --bg-primary: #0a0612;
      --bg-secondary: #12081f;
      --bg-glass: rgba(20, 10, 35, 0.7);
      --text-primary: #f3e8ff;
      --text-secondary: #c4b5fd;
      --accent: #a78bfa;
      --accent-glow: #c084fc;
      --neon-1: #d946ef;
      --neon-2: #e879f9;
      --neon-3: #f0abfc;
      --border: rgba(167, 139, 250, 0.3);
      --shadow: 0 8px 32px rgba(168, 85, 247, 0.25);
      --upload-bg: rgba(30, 15, 50, 0.6);
      --upload-border: #7c3aed;
      --upload-hover: #a78bfa;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Vazirmatn', system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.5s ease, color 0.4s ease;
      position: relative;
    }

    .bg-orbs {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.5;
      animation-name: float;
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      will-change: transform;
    }

    .orb-1 {
      width: 480px;
      height: 480px;
      background: var(--neon-1);
      top: -150px;
      right: -100px;
      animation-duration: 8s;
      animation-delay: 0s;
    }

    .orb-2 {
      width: 400px;
      height: 400px;
      background: var(--neon-2);
      bottom: -120px;
      left: -80px;
      animation-duration: 10s;
      animation-delay: -3s;
    }

    .orb-3 {
      width: 320px;
      height: 320px;
      background: var(--neon-3);
      top: 35%;
      left: 55%;
      opacity: 0.35;
      animation-duration: 12s;
      animation-delay: -6s;
    }

    .orb-4 {
      width: 250px;
      height: 250px;
      background: var(--neon-1);
      top: 60%;
      right: 15%;
      opacity: 0.3;
      animation-duration: 9s;
      animation-delay: -4s;
    }

    @keyframes float {
      0%   { transform: translate(0, 0) scale(1) rotate(0deg); }
      20%  { transform: translate(80px, -60px) scale(1.08) rotate(20deg); }
      40%  { transform: translate(-70px, 90px) scale(0.92) rotate(80deg); }
      60%  { transform: translate(120px, 40px) scale(1.12) rotate(140deg); }
      80%  { transform: translate(-100px, -80px) scale(0.95) rotate(220deg); }
      100% { transform: translate(0, 0) scale(1) rotate(360deg); }
    }

    .neon-lines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(90deg, transparent 90.5%, rgba(167, 139, 250, 0.09) 50%, transparent 50.5%),
        linear-gradient(0deg, transparent 90.5%, rgba(167, 139, 250, 0.07) 50%, transparent 50.5%),
        linear-gradient(90deg, transparent 90%, rgba(232, 121, 249, 0.04) 50%, transparent 51%),
        linear-gradient(0deg, transparent 90%, rgba(232, 121, 249, 0.03) 50%, transparent 51%);
      background-size: 70px 70px, 70px 70px, 140px 140px, 140px 140px;
      animation: 
        gridMove 18s linear infinite,
        gridMove2 32s linear infinite reverse,
        pulseGrid 8s ease-in-out infinite;
      opacity: 0.6;
    }

    @keyframes gridMove {
      0%   { background-position: 0 0, 0 0, 0 0, 0 0; }
      100% { background-position: 70px 70px, 70px 70px, 140px 140px, 140px 140px; }
    }

    @keyframes gridMove2 {
      0%   { background-position: 0 0, 0 0, 0 0, 0 0; }
      100% { background-position: -70px 70px, 70px -70px, -140px 140px, 140px -140px; }
    }

    @keyframes pulseGrid {
      0%, 100% { opacity: 0.45; }
      50%      { opacity: 0.75; }
    }

    header {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 2.5rem;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--neon-1), var(--neon-3));
      display: grid;
      place-items: center;
      box-shadow: 0 0 20px rgba(167, 139, 250, 0.5),
                  0 0 40px rgba(217, 70, 239, 0.3);
      animation: pulse-glow 3s infinite ease-in-out;
    }

    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(167, 139, 250, 0.5), 0 0 40px rgba(217, 70, 239, 0.3); }
      50%      { box-shadow: 0 0 30px rgba(167, 139, 250, 0.7), 0 0 60px rgba(217, 70, 239, 0.45); }
    }

    .logo-icon svg {
      width: 28px;
      height: 28px;
    }

    .theme-switch {
      position: relative;
      width: 64px;
      height: 34px;
      cursor: pointer;
    }

    .theme-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #7c3aed, #c026d3);
      border-radius: 34px;
      transition: 0.4s;
      box-shadow: 0 0 15px rgba(167, 139, 250, 0.5),
                  inset 0 0 8px rgba(255, 255, 255, 0.2);
    }

    .slider::before {
      content: "";
      position: absolute;
      height: 26px;
      width: 26px;
      right: 4px;
      bottom: 4px;
      background: white;
      border-radius: 50%;
      transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    input:checked + .slider {
      background: linear-gradient(135deg, #4c1d95, #7e22ce);
    }

    input:checked + .slider::before {
      transform: translateX(-30px);
    }

    .theme-icons {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 9px;
      pointer-events: none;
      font-size: 13px;
    }

    main {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 140px);
      padding: 2rem 2rem 6rem;
    }

    .hero-title {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .hero-title h1 {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 700;
      background: linear-gradient(135deg, var(--neon-1), var(--neon-3), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.6rem;
    }

    .hero-title p {
      color: var(--text-secondary);
      font-size: 1.05rem;
      font-weight: 400;
    }

    .upload-card {
      width: min(720px, 100%);
      background: var(--bg-glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: var(--shadow),
                  0 0 0 1px rgba(167, 139, 250, 0.1),
                  0 0 60px rgba(139, 92, 246, 0.12);
      transition: box-shadow 0.3s ease;
    }

    .upload-card:hover {
      box-shadow: var(--shadow),
                  0 0 0 1px rgba(167, 139, 250, 0.2),
                  0 0 80px rgba(139, 92, 246, 0.2);
    }

    .upload-zone {
      position: flex;
      width: 100%;
      height: 180px;
      border: 2px dashed var(--upload-border);
      border-radius: 16px;
      background: var(--upload-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    .upload-zone::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, transparent, rgba(167, 139, 250, 0.08), transparent);
      opacity: 0;
      transition: opacity 0.35s;
    }

    .upload-zone:hover {
      border-color: var(--upload-hover);
      box-shadow: 0 0 30px rgba(167, 139, 250, 0.25),
                  inset 0 0 20px rgba(167, 139, 250, 0.05);
      transform: translateY(-2px);
    }

    .upload-zone:hover::before {
      opacity: 1;
    }

    .upload-zone.dragover {
      border-color: var(--neon-2);
      border-style: solid;
      box-shadow: 0 0 40px rgba(232, 121, 249, 0.35),
                  inset 0 0 30px rgba(232, 121, 249, 0.1);
    }

    .upload-zone.has-image {
      border-style: solid;
      border-color: var(--neon-1);
      padding: 0;
    }

    .upload-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--neon-1), var(--neon-3));
      display: grid;
      place-items: center;
      box-shadow: 0 0 25px rgba(167, 139, 250, 0.45);
      transition: transform 0.3s;
    }

    .upload-zone:hover .upload-icon {
      transform: scale(1.08);
    }

    .upload-icon svg {
      width: 28px;
      height: 28px;
      fill: white;
    }

    .upload-text {
      text-align: center;
    }

    .upload-text strong {
      display: block;
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      color: var(--text-primary);
    }

    .upload-text span {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    #fileInput {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .preview-single {
      display: none;
      width: 100%;
      height: 100%;
      position: relative;
    }

    .preview-single.active {
      display: block;
    }

    .preview-single img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 14px;
    }

    .preview-single .remove-btn {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all 0.2s;
      z-index: 5;
    }

    .preview-single .remove-btn:hover {
      background: rgba(220, 38, 38, 0.85);
      transform: scale(1.1);
    }

    .submit-btn {
      display: none;
      width: 100%;
      margin-top: 1.75rem;
      padding: 1rem 2rem;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--neon-1), var(--neon-3));
      color: white;
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 25px rgba(167, 139, 250, 0.4),
                  0 4px 15px rgba(139, 92, 246, 0.3);
      position: relative;
      overflow: hidden;
    }

    .submit-btn.active {
      display: block;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 35px rgba(167, 139, 250, 0.55),
                  0 6px 20px rgba(139, 92, 246, 0.4);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transform: translateX(-100%);
      transition: transform 0.5s;
    }

    .submit-btn:hover::after {
      transform: translateX(100%);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--bg-glass);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2rem;
      width: min(400px, 100%);
      text-align: center;
      box-shadow: 0 0 50px rgba(139, 92, 246, 0.3);
      animation: modalIn 0.3s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.9) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal h3 {
      font-size: 1.3rem;
      margin-bottom: 0.75rem;
      color: var(--text-primary);
    }

    .modal p {
      color: var(--text-secondary);
      margin-bottom: 1.75rem;
      font-size: 0.95rem;
      line-height: 1.7;
    }

    .modal-buttons {
      display: flex;
      gap: 0.85rem;
    }

    .modal-btn {
      flex: 1;
      padding: 0.85rem;
      border-radius: 12px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
      border: none;
    }

    .modal-btn.confirm {
      background: linear-gradient(135deg, var(--neon-1), var(--neon-3));
      color: white;
      box-shadow: 0 0 20px rgba(167, 139, 250, 0.35);
    }

    .modal-btn.confirm:hover {
      box-shadow: 0 0 28px rgba(167, 139, 250, 0.5);
      transform: translateY(-1px);
    }

    .modal-btn.cancel {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .modal-btn.cancel:hover {
      border-color: var(--neon-2);
      color: var(--neon-2);
    }

    footer {
      position: relative;
      z-index: 5;
      text-align: center;
      padding: 1.5rem;
      color: var(--text-secondary);
      font-size: 0.85rem;
      opacity: 0.8;
    }

    footer a {
      color: var(--neon-2);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }

    footer a:hover {
      color: var(--neon-1);
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      header {
        padding: 1.1rem 1.25rem;
      }
      .upload-card {
        padding: 1.5rem;
      }
      .upload-zone {
        height: 160px;
      }
      .logo {
        font-size: 1.1rem;
      }
    }
    .upload-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="orb orb-4"></div>
  </div>
  <div class="neon-lines"></div>

  <header>
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24">
          <rect x="2" y="6.5" width="20" height="11" rx="2" fill="white"/>
          <rect x="3.2" y="7.7" width="17.6" height="8.6" rx="1" fill="none" stroke="#7c3aed" stroke-width="1.1"/>
          <rect x="4.8" y="9.3" width="1.7" height="5.4" rx="0.35" fill="#7c3aed"/>
          <rect x="7.3" y="9.3" width="1.7" height="5.4" rx="0.35" fill="#7c3aed"/>
          <rect x="9.8" y="9.3" width="1.7" height="5.4" rx="0.35" fill="#7c3aed"/>
          <rect x="12.3" y="9.6" width="0.7" height="4.8" rx="0.2" fill="#7c3aed" opacity="0.7"/>
          <rect x="13.8" y="9.3" width="1.7" height="5.4" rx="0.35" fill="#7c3aed"/>
          <rect x="16.3" y="9.3" width="1.7" height="5.4" rx="0.35" fill="#7c3aed"/>
          <rect x="18.8" y="9.3" width="1.5" height="5.4" rx="0.35" fill="#7c3aed"/>
        </svg>
      </div>
      <span>IRAN License Plate Reader</span>
    </div>

    <label class="theme-switch" title="تغییر تم">
      <input type="checkbox" id="themeToggle">
      <span class="slider"></span>
      <div class="theme-icons">
        <span>🌙</span>
        <span>☀️</span>
      </div>
    </label>
  </header>

  <main>
    <div class="hero-title">
      <h1>آپلود عکس پلاک خودرو</h1>
      <p>سامانه هوشمند تشخیص و تحلیل پلاک خودرو از روی تصویر</p>
    </div>

    <div class="upload-card">
      <div class="upload-zone" id="uploadZone">

        <input type="file" id="fileInput" accept="image/*" hidden>

        <label for="fileInput" class="upload-content" id="uploadContent">
          <div class="upload-icon">
            <svg viewBox="0 0 24 24">
              <path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/>
            </svg>
          </div>

          <div class="upload-text">
            <strong>آپلود تصویر پلاک</strong>
            <span>فرمت‌های پشتیبانی‌شده: JPG, PNG, WEBP, BMP و ...</span>
          </div>
        </label>

        <div class="preview-single" id="previewSingle">
          <img id="previewImg" src="" alt="پیش‌نمایش تصویر">
          <button type="button" class="remove-btn" id="removeBtn" title="حذف تصویر">×</button>
        </div>

      </div>

      <button type="button" class="submit-btn" id="submitBtn">
        ثبت و پردازش تصویر
      </button>
    </div>
  </main>

  <footer>
    Developed by
    <a href="https://github.com/ashkan0201" target="_blank" rel="noopener noreferrer">
      Ashkan Noroozi
    </a>
  </footer>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3>تأیید نهایی</h3>
      <p>آیا از صحت تصویر انتخاب‌شده مطمئن هستید؟<br>پس از تأیید، تصویر برای تشخیص پلاک ارسال می‌شود.</p>
      <div class="modal-buttons">
        <button class="modal-btn cancel" id="cancelBtn">انصراف</button>
        <button class="modal-btn confirm" id="confirmBtn">بله، مطمئنم</button>
      </div>
    </div>
  </div>

  <script>
    const themeToggle = document.getElementById('themeToggle');
    const html = document.documentElement;

    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (prefersDark) {
      html.setAttribute('data-theme', 'dark');
      themeToggle.checked = true;
    }

    themeToggle.addEventListener('change', () => {
      if (themeToggle.checked) {
        html.setAttribute('data-theme', 'dark');
      } else {
        html.removeAttribute('data-theme');
      }
    });

    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    const uploadContent = document.getElementById('uploadContent');
    const previewSingle = document.getElementById('previewSingle');
    const previewImg = document.getElementById('previewImg');
    const removeBtn = document.getElementById('removeBtn');
    const submitBtn = document.getElementById('submitBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const cancelBtn = document.getElementById('cancelBtn');
    const confirmBtn = document.getElementById('confirmBtn');

    let currentFile = null;

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      uploadZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
      });
    });

    ['dragenter', 'dragover'].forEach(eventName => {
      uploadZone.addEventListener(eventName, () => {
        uploadZone.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach(eventName => {
      uploadZone.addEventListener(eventName, () => {
        uploadZone.classList.remove('dragover');
      });
    });

    uploadZone.addEventListener('drop', (e) => {
      const files = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/'));
      if (files.length > 0) handleFile(files[0]);
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) handleFile(fileInput.files[0]);
    });

    function handleFile(file) {
      currentFile = file;
      const reader = new FileReader();
      reader.onload = (e) => {
        previewImg.src = e.target.result;
        uploadContent.style.display = 'none';
        previewSingle.classList.add('active');
        uploadZone.classList.add('has-image');
        submitBtn.classList.add('active');
      };
      reader.readAsDataURL(file);
    }

    removeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      resetUpload();
    });

    function resetUpload() {
      currentFile = null;
      fileInput.value = '';
      previewImg.src = '';
      uploadContent.style.display = 'flex';
      previewSingle.classList.remove('active');
      uploadZone.classList.remove('has-image');
      submitBtn.classList.remove('active');
    }

    submitBtn.addEventListener('click', () => {
      if (currentFile) modalOverlay.classList.add('active');
    });

    cancelBtn.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
    });

    confirmBtn.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
      alert('تصویر با موفقیت ارسال شد');
      resetUpload();
    });

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        modalOverlay.classList.remove('active');
      }
    });
  </script>
</body>
</html>
